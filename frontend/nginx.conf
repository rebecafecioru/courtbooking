# The scheme the browser used: from a proxy in front of this one (e.g. a
# hosting platform that handles HTTPS), or this server's own if there's none
map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the backend container ("backend" in docker-compose.yml),
    # so the browser only ever talks to this one site and CORS isn't needed.
    location /api/ {
        proxy_pass http://backend:8080;
        # Spring compares the browser's Origin header with the address it
        # thinks it's on, and refuses POSTs as cross-site if they differ. So
        # pass the address exactly as the browser saw it: $http_host keeps
        # the port ($host would drop it), plus the original scheme.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the React app
    location / {
        try_files $uri /index.html;
    }

    # The built JS and CSS have content hashes in their names, so they can be
    # cached for a long time; index.html must not be, or users would keep
    # loading old versions
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
