# Activate with: --spring.profiles.active=postgres
# All values are read from environment variables - nothing sensitive committed here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/courtbooking}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Never expose the H2 web console on a real deployment
spring.h2.console.enabled=false

# Only needed if the frontend is on a different address from the backend,
# e.g. CORS_ALLOWED_ORIGINS=https://courts.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Off unless asked for: the demo accounts have public passwords
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Runs behind a proxy (nginx in docker-compose.yml, maybe a hosting
# platform's HTTPS proxy too): trust its X-Forwarded-* headers, so Spring
# knows the address and scheme the browser actually used. Only private
# network addresses (like Docker's) are trusted.
server.forward-headers-strategy=native
