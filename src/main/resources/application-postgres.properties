# Activate with: --spring.profiles.active=postgres
# All values are read from environment variables - nothing sensitive committed here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/courtbooking}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# The schema comes from Flyway migrations (src/main/resources/db/migration);
# Hibernate only checks the entities match it and refuses to start if not
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# A database created before Flyway (by the old ddl-auto=update) has tables but
# no migration history: treat it as already at V1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Never expose the H2 web console on a real deployment
spring.h2.console.enabled=false

# Only needed if the frontend is on a different address from the backend,
# e.g. CORS_ALLOWED_ORIGINS=https://courts.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Off unless asked for: the demo accounts have public passwords
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Runs behind a proxy (nginx in docker-compose.yml, maybe a hosting
# platform's HTTPS proxy too): trust its X-Forwarded-* headers, so Spring
# knows the address and scheme the browser actually used. Only private
# network addresses (like Docker's) are trusted.
server.forward-headers-strategy=native

# Email. Sent through this SMTP server if SPRING_MAIL_HOST is set (with
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); otherwise
# emails are only written to the log.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:Court Booking <no-reply@localhost>}
