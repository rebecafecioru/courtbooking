spring.application.name=court-booking

# Default profile runs on H2 in-memory DB so the app works with zero setup.
# Switch to Postgres for real use with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:courtbooking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# NOTE: this is a dev-only secret. In real deployment set app.jwt.secret via
# an environment variable, never commit a real secret to source control.
app.jwt.secret=dev-only-secret-key-change-me-please-32-bytes-min
app.jwt.expiration-ms=86400000
